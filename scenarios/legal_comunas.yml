name: legal_comunas
description: >
  Modo legal vigente: comunas indivisibles (Ley 18.700).
  Unidad de decisión = CUT. Grafo operativo a nivel comunal.
  Los datos APC se agregan a nivel de comuna antes de correr ReCom.

observation_unit: ID_DIST
decision_unit: CUT

preserve:
  units: [CUT]
  mode: hard
  split_penalty: 0.0
  min_fragment_pop_share: 0.0

population:
  column: viviendas
  tolerance: 0.05

districts:
  n_districts: 8

sampler:
  method: recom
  n_steps: 10000
  n_steps_warmup: 500
  seed: 42
