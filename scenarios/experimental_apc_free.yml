name: experimental_apc_libre
description: >
  Modo experimental contrafactual: APC como unidad mínima de decisión,
  comunas divisibles. No corresponde a ninguna norma electoral vigente.
  Útil para medir el costo de la restricción comunal (Ley 18.700).

observation_unit: ID_DIST
decision_unit: ID_DIST

preserve:
  units: []
  mode: none
  split_penalty: 0.0
  min_fragment_pop_share: 0.0

population:
  column: viviendas
  tolerance: 0.05

districts:
  n_districts: 8

sampler:
  method: recom
  n_steps: 10000
  n_steps_warmup: 500
  seed: 42
